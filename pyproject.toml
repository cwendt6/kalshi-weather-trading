[project]
name = "kalshi-trading-system"
version = "0.1.0"
description = "Automated trader for Kalshi weather markets: NWS forecasts vs market prices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cole Wendt"}
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.29.0",
    "streamlit-autorefresh>=1.0.1",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]
reports = [
    "openpyxl>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "respx>=0.20.0",
    "pyyaml>=6.0",
    "ruff>=0.1.0",
]

[project.scripts]
kalshi-dashboard = "src.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "kalshi.*",
    "finnhub.*",
    "feedparser.*",
    "vaderSentiment.*",
    "transformers.*",
    "streamlit.*",
    "plotly.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
